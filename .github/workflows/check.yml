name: Check Group Audios

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-group-audios
  cancel-in-progress: true

jobs:
  run-logger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1
          pip install --no-cache-dir requests numpy soundfile pyloudnorm matplotlib

      - name: Run script
        env:
          ROBLOXCOOKIE: ${{ secrets.ROBLOXCOOKIE }}
          WEBHOOKURL: ${{ secrets.WEBHOOKURL }}
        run: python main.py

      - name: Commit and push seen audios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_audios.json
          git status
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update seen audios list [skip ci]" && git push)
